<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#08090a;color:#e2ddd8;font-family:'Jost',sans-serif}
input,textarea,select,button{font-family:'Jost',sans-serif}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:#08090a}::-webkit-scrollbar-thumb{background:#2a2d32;border-radius:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(181,96,106,0.3)}50%{box-shadow:0 0 18px rgba(181,96,106,0.6)}}
.fu{animation:fadeUp 0.45s cubic-bezier(.22,.68,0,1.15) both}
.fi{animation:fadeIn 0.3s ease both}
.logo{display:flex;align-items:center;gap:10px}
.logo-dot{width:8px;height:8px;background:#b5606a;border-radius:50%;display:inline-block;box-shadow:0 0 10px #b5606a;animation:glow 2.5s ease infinite}

.inp:focus{border-color:#b5606a}

.field{margin-bottom:18px}

.topnav{display:flex;justify-content:space-between;align-items:center;padding:0 24px;height:62px;border-bottom:1px solid #222428;background:#0f1012;position:sticky;top:0;z-index:100}
.tab-nav{display:flex;gap:2px}
.tab-btn{background:transparent;border:none;color:#7a7670;padding:8px 18px;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;position:relative;margin-bottom:-1px}
.tab-btn.active{color:#d4858f;border-bottom-color:#b5606a}
.badge{position:absolute;top:4px;right:6px;width:17px;height:17px;background:#b5606a;border-radius:50%;font-size:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.container{max-width:1180px;margin:0 auto;padding:0 24px 80px}
.grid2{display:grid;grid-template-columns:1fr 280px;gap:28px}
.sidebar{display:flex;flex-direction:column;gap:16px}
.sbox{background:#0f1012;border:1px solid #222428;padding:22px}
.sec-title{font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#b5606a;margin-bottom:16px}
.rcard{border:1px solid #222428;border-left:3px solid #7a7670;background:#0f1012;margin-bottom:10px}
.rcard-h{padding:20px 22px;cursor:pointer}
.rcard-h:hover{background:rgba(255,255,255,0.022)}
.rcard-b{padding:0 22px 22px;border-top:1px solid #222428;display:none}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:500;flex-shrink:0;border:1px solid #222428;background:#161719}
.msg-grid{display:grid;grid-template-columns:260px 1fr;border:1px solid #222428;min-height:500px}
.msg-list{border-right:1px solid #222428}
.mthread{padding:14px 16px;border-bottom:1px solid #222428;cursor:pointer;border-left:3px solid transparent;transition:all 0.15s}
.mthread:hover{background:rgba(255,255,255,0.022)}
.mthread.active{background:rgba(181,96,106,0.12);border-left-color:#b5606a}
.chat{display:flex;flex-direction:column;height:100%}
.chatmsgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;min-height:380px}
.bubble{max-width:70%;padding:10px 14px;font-size:13px;line-height:1.65;font-weight:300}
.bubble.me{background:rgba(181,96,106,0.12);border:1px solid rgba(181,96,106,0.28);align-self:flex-end}
.bubble.them{background:#161719;border:1px solid #222428;align-self:flex-start}
.chatinp{padding:12px 16px;border-top:1px solid #222428;display:flex;gap:8px}
.progress{display:flex;gap:3px;margin:28px 0 36px}
.pstep{flex:1;height:2px;background:#222428;transition:background 0.35s}
.pstep.on{background:#b5606a}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #222428;margin-top:80px}
.fcell{padding:28px;border-top:1px solid #222428}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:13px 28px;font-size:13px;z-index:9999;box-shadow:0 6px 32px rgba(0,0,0,0.5);white-space:nowrap;border-radius:1px;display:none;color:#fff}
@media(max-width:700px){.grid2{grid-template-columns:1fr}.sidebar{display:none}.msg-grid{grid-template-columns:1fr}.feature-grid{grid-template-columns:1fr}.card-inner{padding:32px 20px}}
</style>
</head>

var S={screen:"landing",user:null,filterType:"all",cityFilter:"",searchQ:"",msgThread:null,regStep:1,regData:{},mockCode:"J411-"+(1000+Math.floor(Math.random()*9000)),rf:{clientName:"",clientPhone:"",city:"",notes:"",paid:0,gentleman:0,bargained:0,recommend:false,banned:false},

function risk(r){var a=(r.paid+r.gentleman+r.bargained)/3;if(a>=4.2)return{label:“Good Client”,color:T.green,bg:“rgba(90,144,112,0.08)”,bar:T.green};if(a>=2.8)return{label:“Use Caution”,color:T.amber,bg:“rgba(176,128,64,0.08)”,bar:T.amber};return{label:“Avoid”,color:T.red,bg:“rgba(176,80,80,0.1)”,bar:T.red};}
function fire(msg,type){var t=document.getElementById(“toast”);t.textContent=(type===“err”?“✕ “:“✓ “)+msg;t.style.display=“block”;t.style.background=type===“err”?T.red:T.green;setTimeout(function(){t.style.display=“none”;},3200);}
function avi(name,size){var cs=[”#b5606a”,”#b8975a”,”#5a9070”,”#7a70b5”,”#b08040”];var c=cs[name?name.charCodeAt(0)%5:0];size=size||32;return ‘<div class="avatar" style="width:'+size+'px;height:'+size+'px;font-size:'+(size*0.4)+'px;color:'+c+'">’+((name&&name[0])||”?”)+’</div>’;}
function stars(v,col,sz){col=col||T.gold;sz=sz||18;return [1,2,3,4,5].map(function(n){return ‘<span style="font-size:'+sz+'px;color:'+(n<=v?col:T.border)+'">’+(n<=v?“★”:“☆”)+’</span>’;}).join(””);}
function unread(){if(!S.user)return 0;return S.messages.filter(function(m){return m.toId===S.user.id&&!m.read;}).length;}
function nav(screen){S.screen=screen;if(screen!==“messages”)S.msgThread=null;render();}
function logo(center){return ‘<div class=“logo” style=“justify-content:’+(center?“center”:“flex-start”)+’”><span class="logo-dot"></span><span class="logo-text">John's 411</span></div>’;}
function appbar(){var u=unread();return ‘<nav class="topnav">’+logo()+’<div class="tab-nav"><button class=“tab-btn’+(S.screen===“dashboard”?” active”:””)+’" onclick="nav('dashboard')">Reports</button><button class=“tab-btn’+(S.screen===“messages”?” active”:””)+’" onclick="nav('messages')" style=“position:relative”>Messages’+(u>0?’<span class="badge">’+u+’</span>’:””)+’</button><button class=“tab-btn’+(S.screen===“profile”?” active”:””)+’" onclick="nav('profile')">Profile</button></div><button class="btn-primary btn-sm" onclick="nav(\'report\')">+ Report</button></nav>’;}

function render(){
var app=document.getElementById(“app”);
if(S.screen===“landing”)app.innerHTML=renderLanding();
else if(S.screen===“login”)app.innerHTML=renderLogin();
else if(S.screen===“register”)app.innerHTML=renderRegister();
else if(S.screen===“dashboard”)app.innerHTML=renderDashboard();
else if(S.screen===“report”)app.innerHTML=renderReportForm();
else if(S.screen===“messages”)app.innerHTML=renderMessages();
else if(S.screen===“profile”)app.innerHTML=renderProfile();
var cm=document.getElementById(“chatmsgs”);if(cm)cm.scrollTop=cm.scrollHeight;
}

function renderLanding(){
var feats=[[“🔐”,“Verified Members Only”,“Your working phone and email confirmed before access.”],[“⭐”,“5-Star Client Reviews”,“Rate payment, conduct, and bargaining.”],[“🔍”,“Search by City”,“Find reports from your area or cities you travel to.”],[“🤝”,“Corroborate Reports”,“Confirm it happened to you too — adds credibility.”],[“💬”,“Private Messaging”,“Message verified members securely and privately.”],[“🚫”,“Community Ban List”,“Flag a number — added to every member’s block list.”]];
return ‘<div class="page"><div style="position:fixed;inset:0;background:radial-gradient(ellipse 55% 35% at 75% 15%,rgba(181,96,106,0.07),transparent 70%);pointer-events:none"></div><nav style="display:flex;justify-content:space-between;align-items:center;padding:0 48px;height:66px;border-bottom:1px solid #222428;background:#0f1012;position:sticky;top:0;z-index:50">’+logo()+’<div style="display:flex;gap:12px"><button class="btn-outline" onclick="nav(\'register\')">Join</button><button class="btn-primary" onclick="nav(\'login\')">Sign In</button></div></nav><div style="max-width:980px;margin:0 auto;padding:80px 48px 60px;position:relative;z-index:1"><div class="fu" style="font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:#b5606a;margin-bottom:24px;display:flex;align-items:center;gap:14px"><span style="width:36px;height:1px;background:#b5606a;display:inline-block"></span>Private · Verified · Independent Escorts Only</div><h1 class="fu" style="font-family:\'Playfair Display\',serif;font-size:clamp(40px,7vw,78px);font-weight:400;line-height:1.0;letter-spacing:-0.02em;margin-bottom:30px;animation-delay:0.07s">John's 411<br><em style="font-style:italic;color:#d4858f">The inside word,<br>from us — for us.</em></h1><p class="fu" style="color:#7a7670;font-size:17px;line-height:1.85;max-width:500px;margin-bottom:48px;font-weight:300;animation-delay:0.14s">A closed, verified community exclusively for independent escorts. Report bad clients, rate encounters, search by city, and message each other privately. No agencies. No outsiders. Ever.</p><div class="fu" style="display:flex;gap:14px;flex-wrap:wrap;animation-delay:0.21s"><button class="btn-primary" style="padding:15px 40px;font-size:13px" onclick="nav(\'register\')">Apply for Access</button><button class="btn-outline" style="padding:15px 40px;font-size:13px" onclick="nav(\'login\')">Member Login</button></div><div class="feature-grid">’+feats.map(function(f,i){return ‘<div class=“fcell fu” style=“border-right:’+(((i+1)%3!==0)?“1px solid #222428”:“none”)+’;animation-delay:’+(0.28+i*0.06)+‘s”><div style="font-size:24px;margin-bottom:12px">’+f[0]+’</div><div style="font-family:\'Playfair Display\',serif;font-size:15px;margin-bottom:8px;color:#d4b47a">’+f[1]+’</div><div style="font-size:13px;color:#7a7670;line-height:1.8;font-weight:300">’+f[2]+’</div></div>’;}).join(””)+’</div></div><footer style="border-top:1px solid #222428;padding:24px 48px;display:flex;justify-content:space-between;align-items:center;background:#0f1012;flex-wrap:wrap;gap:12px"><div style="font-size:12px;color:#3e3c3a">© 2025 John's 411 — Private community. All rights reserved.</div></footer></div>’;}

function renderLogin(){
return ‘<div class="card"><div class="card-inner fu">’+logo(true)+’<div style="font-family:\'Playfair Display\',serif;font-size:24px;color:#d4858f;margin:26px 0 6px">Member Sign In</div><div style="font-size:13px;color:#7a7670;margin-bottom:30px;font-weight:300">Verified independent escorts only.</div><div class="field"><div class="field-label">Working email</div><input class="inp" type="email" id="lem" placeholder="you@proton.me"></div><div class="field"><div class="field-label">Working phone</div><input class="inp" type="tel" id="lph" placeholder="555-000-0000"></div><button class="btn-primary" style="width:100%;padding:14px" onclick="doLogin()">Sign In</button><div style="margin-top:16px;font-size:12px;color:#3e3c3a;text-align:center"><span style="cursor:pointer;color:#7a7670" onclick="nav(\'register\')">Not a member? Apply →</span>  ·  <span style="cursor:pointer;color:#7a7670" onclick="nav(\'landing\')">← Back</span></div><div style="margin-top:24px;padding-top:20px;border-top:1px solid #222428"><div style="font-size:11px;color:#3e3c3a;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:10px">Demo — quick login</div>’+S.members.map(function(m){return ‘<button class="btn-outline" style="width:100%;text-align:left;margin-bottom:6px;padding:9px 14px;font-size:12px" onclick="loginAs('+m.id+')">→ ‘+m.workName+’ · ‘+m.city+’</button>’;}).join(””)+’</div></div></div>’;}

function renderRegister(){
var s=S.regStep,d=S.regData;
var steps=’<div class="progress">’+[1,2,3].map(function(n){return ‘<div class=“pstep’+(n<=s?” on”:””)+’”></div>’;}).join(””)+’</div>’;
var inner=””;
if(s===1){inner=’<div style="font-family:\'Playfair Display\',serif;font-size:24px;color:#d4858f;margin-bottom:6px">Apply for Access</div><div style="font-size:13px;color:#7a7670;margin-bottom:24px;font-weight:300;line-height:1.75">John's 411 is exclusively for independent escorts. We verify your working contact details before granting access.</div><div class="field"><div class="field-label">Working name / alias</div><input class=“inp” type=“text” id=“rname” placeholder=“Your professional name” value=”’+(d.workName||””)+’”></div><div class="field"><div class="field-label">Phone in your ads *</div><input class=“inp” type=“tel” id=“rphone” placeholder=“555-000-0000” value=”’+(d.phone||””)+’”></div><div class="field"><div class="field-label">Email in your ads *</div><input class=“inp” type=“email” id=“remail” placeholder=“you@proton.me” value=”’+(d.email||””)+’”></div><div class="field"><div class="field-label">Your city</div><input class=“inp” type=“text” id=“rcity” placeholder=“e.g. Atlanta, GA” value=”’+(d.city||””)+’”></div><button class="btn-primary" style="width:100%;padding:14px" onclick="reg1()">Continue →</button><div style="margin-top:14px;font-size:12px;color:#3e3c3a;text-align:center;cursor:pointer" onclick="nav(\'landing\')">← Back</div>’;}
else if(s===2){inner=’<div style="font-family:\'Playfair Display\',serif;font-size:24px;color:#d4858f;margin-bottom:6px">Confirm Independence</div><div style="font-size:13px;color:#7a7670;margin-bottom:20px;font-weight:300;line-height:1.75">John's 411 is for independent escorts only — no agencies.</div><div style="background:'+T.goldDim+';border:1px solid rgba(184,151,90,0.22);padding:16px;margin-bottom:20px;font-size:13px;color:#7a7670;line-height:1.75;font-weight:300"><span style="color:#d4b47a;font-weight:400">Why we verify: </span>This community's value depends entirely on trust.</div><label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;margin-bottom:22px"><input type=“checkbox” id=“rconfirm” ‘+(d.confirmed?“checked”:””)+‘style=“accent-color:#b5606a;margin-top:3px;width:15px;height:15px”><span style="font-size:13px;color:#7a7670;line-height:1.65;font-weight:300">I confirm I am an independent escort, not affiliated with any agency.</span></label><div style="display:flex;gap:10px"><button class="btn-outline" onclick="S.regStep=1;render()">← Back</button><button class="btn-primary" style="flex:1;padding:14px" onclick="reg2()">Continue →</button></div>’;}
else{inner=’<div style="font-family:\'Playfair Display\',serif;font-size:24px;color:#d4858f;margin-bottom:6px">Verify Your Details</div><div style="font-size:13px;color:#7a7670;margin-bottom:20px;font-weight:300;line-height:1.75">In production a code is sent to <strong style="color:#e2ddd8">’+d.phone+’</strong>. Enter it below.</div><div style="background:'+T.roseDim+';border:1px solid rgba(181,96,106,0.25);padding:18px;margin-bottom:22px"><div style="font-size:11px;color:#b5606a;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px">Demo code</div><div style="font-family:monospace;font-size:26px;color:#d4858f;letter-spacing:0.15em;font-weight:500">’+S.mockCode+’</div></div><div class="field"><div class="field-label">Enter your code</div><input class="inp" type="text" id="rcode" placeholder="J411-XXXX"></div><div style="display:flex;gap:10px"><button class="btn-outline" onclick="S.regStep=2;render()">← Back</button><button class="btn-primary" style="flex:1;padding:14px" onclick="reg3()">Complete Registration →</button></div><div style="margin-top:10px;font-size:11px;color:#3e3c3a;text-align:center">Demo: any 4+ character code works</div>’;}
return ‘<div class="card"><div class="card-inner fu" style="max-width:520px">’+logo(true)+steps+inner+’</div></div>’;}

function renderDashboard(){
var u=S.user;
var cities=[“All Cities”].concat([…new Set(S.reports.map(function(r){return r.city;}))].sort());
var filtered=S.reports.filter(function(r){
var q=S.searchQ.toLowerCase();
var mq=!q||r.clientPhone.includes(q)||r.clientName.toLowerCase().includes(q)||r.city.toLowerCase().includes(q);
var mc=!S.cityFilter||S.cityFilter===“All Cities”||r.city===S.cityFilter;
if(!mq||!mc)return false;
var ri=risk(r);
if(S.filterType===“avoid”)return ri.label===“Avoid”;
if(S.filterType===“caution”)return ri.label===“Use Caution”;
if(S.filterType===“good”)return ri.label===“Good Client”;
if(S.filterType===“banned”)return r.banned;

function doLogin(){var em=document.getElementById(“lem”)&&document.getElementById(“lem”).value;var ph=document.getElementById(“lph”)&&document.getElementById(“lph”).value;var f=S.members.find(function(m){return m.email===em||m.phone===ph;});if(f){loginAs(f.id);}else{fire(“No verified member found. Please register.”,“err”);}}
