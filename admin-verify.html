<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verification Queue — Admin</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1416;
    color: #f4ece6;
    padding: 24px;
  }
  h1 { color: #e8b4bc; font-size: 1.4rem; }
  .card {
    background: #241c1f;
    border: 1px solid #3a2c30;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .card .name { font-weight: 600; font-size: 1.05rem; }
  .card a { color: #c98a96; word-break: break-all; }
  .card .date { color: #8a787c; font-size: 0.8rem; margin-top: 4px; }
  .photo-slot {
    margin-top: 12px;
    color: #8a787c;
    font-size: 0.85rem;
  }
  .photo-slot img {
    width: 100%;
    max-width: 280px;
    border-radius: 8px;
    border: 1px solid #3a2c30;
    display: block;
    margin-top: 6px;
  }
  .actions { margin-top: 14px; display: flex; gap: 10px; }
  button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-weight: 600;
    cursor: pointer;
  }
  .approve { background: #a8d8b0; color: #14241a; }
  .reject { background: #e08a8a; color: #241414; }
  .empty { color: #8a787c; text-align: center; margin-top: 40px; }
</style>
</head>
<body>

<h1>Pending Applications</h1>
<div id="list"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://vjytxxojhdfafuhpjocj.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_mlxt4kHBEfWUtnSpii71jw_h6EiSW6q";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const listEl = document.getElementById('list');

  async function loadQueue() {
    const { data, error } = await supabase
      .from('profiles')
      .select('*')
      .eq('status', 'pending')
      .order('created_at', { ascending: true });

    if (error) {
      listEl.innerHTML = `<div class="empty">Error loading queue: ${error.message}</div>`;
      return;
    }

    if (!data.length) {
      listEl.innerHTML = `<div class="empty">No pending applications.</div>`;
      return;
    }

    listEl.innerHTML = data.map(p => `
      <div class="card" data-id="${p.id}">
        <div class="name">${p.display_name}</div>
        <a href="${p.listing_url}" target="_blank" rel="noopener">${p.listing_url}</a>
        <div class="date">Applied ${new Date(p.created_at).toLocaleDateString()}</div>
        <div class="photo-slot" id="photo-${p.id}">Loading photo...</div>
        <div class="actions">
          <button class="approve" onclick="review('${p.id}', 'verified')">Approve</button>
          <button class="reject" onclick="review('${p.id}', 'rejected')">Reject</button>
        </div>
      </div>
    `).join('');

    // Load each verification photo as a signed (temporary, private) URL
    for (const p of data) {
      if (!p.verification_photo_path) {
        document.getElementById(`photo-${p.id}`).textContent = 'No photo submitted';
        continue;
      }
      const { data: signedData, error: signedError } = await supabase.storage
        .from('verification-photos')
        .createSignedUrl(p.verification_photo_path, 300); // valid 5 min

      const slot = document.getElementById(`photo-${p.id}`);
      if (signedError || !signedData) {
        slot.textContent = 'Could not load photo';
      } else {
        slot.innerHTML = `<img src="${signedData.signedUrl}" alt="Verification photo" />`;
      }
    }
  }

  async function review(id, status) {
    const { data: { user } } = await supabase.auth.getUser();
    const { error } = await supabase
      .from('profiles')
      .update({ status, reviewed_at: new Date().toISOString(), reviewed_by: user?.id })
      .eq('id', id);

    if (error) {
      alert('Error: ' + error.message);
      return;
    }
    loadQueue();
  }

  loadQueue();
</script>

</body>
</html>
